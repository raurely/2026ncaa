const TM={'Duke Blue Devils':'Duke','Connecticut Huskies':'UConn',"Michigan State Spartans":'Michigan St.','Kansas Jayhawks':'Kansas',"St. John's Red Storm":"St. John's",'Louisville Cardinals':'Louisville','UCLA Bruins':'UCLA','Ohio State Buckeyes':'Ohio State','TCU Horned Frogs':'TCU','UCF Knights':'UCF','South Florida Bulls':'South Florida','Northern Iowa Panthers':'Northern Iowa','Cal Baptist Lancers':'Cal Baptist','North Dakota State Bison':'North Dakota St.','Furman Paladins':'Furman','Siena Saints':'Siena','Arizona Wildcats':'Arizona','Purdue Boilermakers':'Purdue','Gonzaga Bulldogs':'Gonzaga','Arkansas Razorbacks':'Arkansas','Wisconsin Badgers':'Wisconsin','BYU Cougars':'BYU','Miami Hurricanes':'Miami (FL)','Villanova Wildcats':'Villanova','Utah State Aggies':'Utah State','Missouri Tigers':'Missouri','High Point Panthers':'High Point','Hawaii Rainbow Warriors':'Hawaii','Kennesaw State Owls':'Kennesaw St.','Queens Royals':'Queens','LIU Sharks':'LIU','Florida Gators':'Florida','Houston Cougars':'Houston','Illinois Fighting Illini':'Illinois','Nebraska Cornhuskers':'Nebraska','Vanderbilt Commodores':'Vanderbilt','North Carolina Tar Heels':'North Carolina',"Saint Mary's Gaels":"Saint Mary's",'Clemson Tigers':'Clemson','Iowa Hawkeyes':'Iowa','Texas A&M Aggies':'Texas A&M','VCU Rams':'VCU','McNeese Cowboys':'McNeese','Troy Trojans':'Troy','Penn Quakers':'Penn','Idaho Vandals':'Idaho','Michigan Wolverines':'Michigan','Iowa State Cyclones':'Iowa State','Virginia Cavaliers':'Virginia','Alabama Crimson Tide':'Alabama','Texas Tech Red Raiders':'Texas Tech','Tennessee Volunteers':'Tennessee','Kentucky Wildcats':'Kentucky','Georgia Bulldogs':'Georgia','Saint Louis Billikens':'Saint Louis','Santa Clara Broncos':'Santa Clara','Akron Zips':'Akron','Hofstra Pride':'Hofstra','Wright State Raiders':'Wright State','Tennessee State Tigers':'Tennessee St.'};
function mn(n){return TM[n]||n;}

// ── LIVE FETCH ───────────────────────────────────────────────────────────────
// Uses XHR (more compatible than fetch on iOS Edge from file://) with proxy fallback
// groups=100 is required to get NCAA tournament games; limit=1000 ensures all games returned
var ESPN_URL='https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=100&limit=1000';
var PROXIES=[
  'https://corsproxy.io/?url='+encodeURIComponent(ESPN_URL),
  'https://api.allorigins.win/raw?url='+encodeURIComponent(ESPN_URL),
  'https://thingproxy.freeboard.io/fetch/'+ESPN_URL,
  ESPN_URL
];
var curProxy=0;

function fetchScores(){
  var sp=document.getElementById('lv-spin');
  var st=document.getElementById('lv-status');
  if(sp)sp.style.display='inline-block';
  if(st)st.textContent='Fetching scores...';
  tryProxy(0);
}

function tryProxy(idx){
  if(idx>=PROXIES.length){
    var st=document.getElementById('lv-status');
    var sp=document.getElementById('lv-spin');
    if(st)st.textContent='All '+PROXIES.length+' sources failed \u2014 tap Refresh to retry';
    if(sp)sp.style.display='none';
    scheduleNext();
    return;
  }
  var label=['corsproxy','allorigins','thingproxy','direct'][idx]||('src'+idx);
  var st0=document.getElementById('lv-status');
  if(st0)st0.textContent='Trying '+label+' ('+( idx+1)+'/'+PROXIES.length+')...';
  var xhr=new XMLHttpRequest();
  xhr.open('GET',PROXIES[idx],true);
  xhr.timeout=10000;
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    if(xhr.status===200&&xhr.responseText){
      try{
        var d=JSON.parse(xhr.responseText);
        if(d&&d.contents)d=JSON.parse(d.contents);
        if(d&&d.events){
          processESPN(d);
          curProxy=idx;
          lastSync=new Date();
          var st2=document.getElementById('lv-status');
          var sp2=document.getElementById('lv-spin');
          if(st2)st2.textContent='Updated '+lastSync.toLocaleTimeString()+' via '+label;
          if(sp2)sp2.style.display='none';
          var ft=document.querySelector('.footer');
          if(ft)ft.textContent='2026 Westover Companies Basketball Pool \xb7 Live \xb7 '+lastSync.toLocaleTimeString();
          scheduleNext();
          rerender();
          return;
        } else {
          var st3=document.getElementById('lv-status');
          if(st3)st3.textContent=label+' returned bad data (status:'+xhr.status+')';
        }
      }catch(e){
        var st4=document.getElementById('lv-status');
        if(st4)st4.textContent=label+' parse error: '+e.message;
      }
    } else {
      var st5=document.getElementById('lv-status');
      if(st5)st5.textContent=label+' failed: HTTP '+xhr.status;
    }
    tryProxy(idx+1);
  };
  xhr.ontimeout=function(){
    var st6=document.getElementById('lv-status');
    if(st6)st6.textContent=label+' timed out';
    tryProxy(idx+1);
  };
  xhr.onerror=function(){
    var st7=document.getElementById('lv-status');
    if(st7)st7.textContent=label+' network error (CORS/blocked)';
    tryProxy(idx+1);
  };
  try{xhr.send();}catch(e){
    var st8=document.getElementById('lv-status');
    if(st8)st8.textContent=label+' exception: '+e.message;
    tryProxy(idx+1);
  }
}

function manualRefresh(){
  clearTimeout(refreshTimer);
  var cdEl=document.getElementById('lv-cd');
  if(cdEl)cdEl.textContent='';
  fetchScores();
}

function processESPN(data){
  LIVE=[];
  var anyLive=false;
  (data.events||[]).forEach(function(ev){
    var comp=ev.competitions&&ev.competitions[0];
    if(!comp)return;
    var state=ev.status&&ev.status.type&&ev.status.type.state;
    if(state==='pre')return;
    var comps=comp.competitors||[];
    if(comps.length<2)return;
    var home=comps.find(function(c){return c.homeAway==='home';})||comps[0];
    var away=comps.find(function(c){return c.homeAway==='away';})||comps[1];
    var hN=mn(home.team&&home.team.displayName||'');
    var aN=mn(away.team&&away.team.displayName||'');
    var hS=parseInt(home.score)||0;
    var aS=parseInt(away.score)||0;
    var pg=GM.find(function(g){
      return(g.favTeam===hN||g.favTeam===aN)&&(g.dogTeam===hN||g.dogTeam===aN);
    });
    if(!pg)return;
    var favIsHome=(hN===pg.favTeam);
    var favS=favIsHome?hS:aS;
    var dogS=favIsHome?aS:hS;
    if(state==='in'){
      anyLive=true;
      LIVE.push({favTeam:pg.favTeam,dogTeam:pg.dogTeam,favScore:favS,dogScore:dogS,
        clock:ev.status.displayClock||'',period:ev.status.period||1,spread:pg.spread});
    }
    if(state==='post'&&pg.outcome==='pending'){
      var margin=favS-dogS;
      if(margin>0){
        var cov=margin+pg.spread;
        if(cov>0)pg.outcome='covers';
        else if(cov===0)pg.outcome='tie';
        else{pg.outcome='no-cover';pg.stolenBy=findDogOwner(pg);}
      }else{pg.outcome='upset';}
    }
  });
  hasLive=anyLive;
  var badge=document.getElementById('lv-badge');
  if(badge)badge.style.display=anyLive?'inline-flex':'none';
}

function findDogOwner(g){
  for(var pi=0;pi<PN.length;pi++){
    var regAS=AS[g.region]||{};
    var found=Object.entries(regAS).find(function(e){return parseInt(e[1])===pi&&parseInt(e[0])===g.dogSeed;});
    if(found)return pi;
  }
  return null;
}

function scheduleNext(){
  clearTimeout(refreshTimer);
  cdSecs=hasLive?30:60;
  var tick=setInterval(function(){cdSecs--;var el=document.getElementById('lv-cd');if(el)el.textContent='Refresh in '+cdSecs+'s';if(cdSecs<=0)clearInterval(tick);},1000);
  refreshTimer=setTimeout(function(){clearInterval(tick);fetchScores();},cdSecs*1000);
}

function liveBar(){
  if(!LIVE.length)return '';
  var h='<div class="lg-wrap"><div class="lg-title"><span class="live-dot" style="background:#c00;width:7px;height:7px;border-radius:50%;display:inline-block;animation:ldpulse 1.2s infinite"></span>GAMES IN PROGRESS</div><div class="lg-row">';
  LIVE.forEach(function(g){
    var cov=(g.favScore-g.dogScore)+g.spread>0;
    var per=g.period>2?'OT':g.period===2?'2nd Half':'1st Half';
    h+='<div class="lg-card">'
      +'<div class="lg-teams"><div style="'+(g.favScore>g.dogScore?'font-weight:800':'')+'">'+g.favTeam+'</div>'
      +'<div style="'+(g.dogScore>g.favScore?'font-weight:800':'')+'">'+g.dogTeam+'</div></div>'
      +'<div class="lg-score">'+g.favScore+' \u2013 '+g.dogScore+'</div>'
      +'<div class="lg-info">'+per+(g.clock?' \xb7 '+g.clock:'')+'</div>'
      +'<div class="lg-cover" style="color:'+(cov?'var(--gn)':'var(--or)')+'">Spread '+(g.spread>0?'+'+g.spread:g.spread)+': '+(cov?'Covering \u2713':'Not covering')+'</div>'
      +'</div>';
  });
  return h+'</div></div>';
}

function isLiveTeam(name){return LIVE.some(function(g){return g.favTeam===name||g.dogTeam===name;});}

// ── ORIGINAL POOL LOGIC — UNCHANGED ─────────────────────────────────────────
function cT(pi){
  var base=RG.map(function(r,ri){
    var e=Object.entries(AS[r]||{}).find(function(entry){return parseInt(entry[1])===pi;});
    if(e){var sn=parseInt(e[0]);var t=BK[r].find(function(t){return t.seed===sn;});return{region:r,rc:RC[ri],team:t?t.team:'TBD',seed:sn,alive:true,acq:false};}
    return{region:r,rc:RC[ri],team:'TBD',seed:'',alive:true,acq:false};
  });
  GM.forEach(function(g){
    if(g.outcome==='covers'||g.outcome==='tie')base.forEach(function(t){if(t.team===g.dogTeam)t.alive=false;});
    else if(g.outcome==='no-cover')base.forEach(function(t){if(t.team===g.favTeam||t.team===g.dogTeam)t.alive=false;});
    else if(g.outcome==='upset')base.forEach(function(t){if(t.team===g.favTeam)t.alive=false;});
  });
  var ex=[];
  GM.forEach(function(g){if(g.outcome==='no-cover'&&g.stolenBy===pi)ex.push({region:g.region,rc:g.regionCode,team:g.favTeam,seed:g.favSeed,alive:true,acq:true});});
  return base.concat(ex);
}

// ── RENDER FUNCTIONS (originals + live enhancements) ─────────────────────────
function rSt(){
  var rows=PN.map(function(n,i){var t=cT(i);return{n:n,t:t,alive:t.filter(function(x){return x.alive&&x.team!=='TBD';}).length};}).sort(function(a,b){return b.alive-a.alive;});
  var sc=GM.filter(function(g){return g.outcome&&g.outcome!=='pending';}).length;
  var al=rows.filter(function(r){return r.alive>0;}).length;
  var st=GM.filter(function(g){return g.outcome==='no-cover'&&g.stolenBy!==null;});
  var up=GM.filter(function(g){return g.outcome==='upset';});
  var h='<div class="stl">Standings</div>'+liveBar()+'<div class="sr">'
    +'<div class="sb"><div class="sv">'+al+'</div><div class="sl">Players alive</div></div>'
    +'<div class="sb"><div class="sv">'+sc+'</div><div class="sl">Games scored</div></div>'
    +'<div class="sb"><div class="sv">'+st.length+'</div><div class="sl">Steals</div></div>'
    +'<div class="sb"><div class="sv">'+up.length+'</div><div class="sl">Upsets</div></div></div>';
  if(rows.length>=3){
    var f=rows[0],s=rows[1],t=rows[2];
    h+='<div class="podium">'
      +'<div class="ps2"><div class="pn2">'+s.n+'</div><div class="pc">'+s.alive+' alive</div><div class="pb2 p2"><span class="pbl">2</span></div></div>'
      +'<div class="ps2"><div class="pn2">'+f.n+'</div><div class="pc">'+f.alive+' alive</div><div class="pb2 p1"><span class="pbl">1</span></div></div>'
      +'<div class="ps2"><div class="pn2">'+t.n+'</div><div class="pc">'+t.alive+' alive</div><div class="pb2 p3"><span class="pbl">3</span></div></div>'
      +'</div>';
  }
  if(LIVE.length){h+='<div class="eb ei">&#x1F3C0; <strong>'+LIVE.length+' game'+(LIVE.length>1?'s':'')+' live</strong> \u2014 standings update automatically.</div>';}
  if(st.length>0){
    h+='<div class="eb es">&#x1F525; <strong>Steals:</strong> ';
    h+=st.map(function(g){return'<strong>'+PN[g.stolenBy]+'</strong> stole '+g.favTeam;}).join(' &middot; ');
    h+='</div>';
  }
  if(up.length>0){
    h+='<div class="eb eu">&#x1F6A8; <strong>Upsets:</strong> ';
    h+=up.map(function(g){return g.dogTeam+' over '+g.favTeam;}).join(' &middot; ');
    h+='</div>';
  }
  h+='<table class="lbt"><thead><tr><th>#</th><th>Player</th><th>Regions</th><th>Teams</th><th>Status</th></tr></thead><tbody>';
  rows.forEach(function(r,rank){
    var rc=rank===0?'r1':rank===1?'r2':rank===2?'r3':'ro';
    var pills='';
    r.t.filter(function(t){return t.team!=='TBD';}).forEach(function(t){
      var live=isLiveTeam(t.team);
      var cls=live?'p-live':t.acq?'pn':t.alive?'pa':'pd';
      pills+='<span class="tp '+cls+'">'+(live?'&#x23F1; ':t.acq?'&#x2605; ':'')+t.team+'</span>';
    });
    var dots='';
    RG.forEach(function(rg){
      dots+='<span class="dot '+(r.t.some(function(t){return t.region===rg&&t.alive&&t.team!=='TBD';})?'da':'dd')+'" title="'+rg+'"></span>';
    });
    h+='<tr class="'+(r.alive>0?'':'out')+'">'
      +'<td><span class="rb '+rc+'">'+(rank+1)+'</span></td>'
      +'<td style="font-weight:600;font-size:12px">'+r.n+'</td>'
      +'<td><div class="ld">'+dots+'</div><div style="font-size:9px;color:var(--mu);margin-top:2px">'+r.alive+' alive</div></td>'
      +'<td style="max-width:200px">'+pills+'</td>'
      +'<td>'+(r.alive>0?'<span style="color:var(--gn);font-weight:600;font-size:11px">IN</span>':'<span style="color:var(--mu);font-size:11px">OUT</span>')+'</td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  if(lastSync)h+='<div class="tsl">Live scores synced: '+lastSync.toLocaleTimeString()+'</div>';
  document.getElementById('mc').innerHTML=h;
}
function rBr(){
  var h='<div class="stl">Team Ownership</div>';
  RG.forEach(function(r){
    var rt=[];
    PN.forEach(function(n,pi){cT(pi).filter(function(t){return t.region===r;}).forEach(function(t){rt.push({seed:t.seed,team:t.team,pn:n,alive:t.alive,acq:t.acq});});});
    rt.sort(function(a,b){return(a.seed||99)-(b.seed||99);});
    h+='<div class="rhdr">'+r+' Region</div><table class="gt"><thead><tr><th>#</th><th>Team</th><th>Owner</th><th>Status</th></tr></thead><tbody>';
    rt.filter(function(t){return t.team!=='TBD';}).forEach(function(t){
      var live=isLiveTeam(t.team);
      h+='<tr><td style="font-size:10px;font-weight:600;color:var(--mu)">'+t.seed+'</td>'
        +'<td style="font-weight:600;font-size:11px">'+t.team+(t.acq?' <span style="font-size:9px;color:var(--or)">&#x2605;</span>':'')+(live?' <span style="font-size:9px;color:#c00">&#x23F1;</span>':'')+'</td>'
        +'<td style="font-size:11px">'+t.pn+'</td>'
        +'<td>'+(live?'<span style="color:#c00;font-size:11px;font-weight:600">Playing</span>':t.alive?'<span style="color:var(--gn);font-size:11px;font-weight:600">Alive</span>':'<span style="color:var(--mu);font-size:11px">Out</span>')+'</td></tr>';
    });
    h+='</tbody></table>';
  });
  document.getElementById('mc').innerHTML=h;
}
function rRe(){
  var gl=GM.filter(function(g){return g.round===CR;});
  var h='<div class="stl">Results</div>'+liveBar()+'<div class="fr"><label style="font-size:12px;font-weight:500">Round:</label><select class="rs" onchange="CR=parseInt(this.value);rRe()">';
  RNS.forEach(function(n,i){h+='<option value="'+i+'"'+(i===CR?' selected':'')+'>'+n+'</option>';});
  h+='</select></div>';
  if(!gl.length){h+='<p style="color:var(--mu);font-size:12px">No games recorded yet.</p>';}
  else{
    h+='<table class="gt"><thead><tr><th>Rgn</th><th>#</th><th>Favored</th><th>Spread</th><th>vs</th><th>Underdog</th><th>Result</th></tr></thead><tbody>';
    gl.forEach(function(g){
      var live=LIVE.find(function(l){return l.favTeam===g.favTeam;});
      var chip;
      if(live){
        var cov=(live.favScore-live.dogScore)+live.spread>0;
        chip='<span class="chip c-live">&#x23F1; '+live.favScore+'\u2013'+live.dogScore+' ('+(cov?'covering':'not covering')+')</span>';
      }else if(g.outcome==='covers')chip='<span class="chip cc">Covered</span>';
      else if(g.outcome==='no-cover')chip='<span class="chip cn">No cover \u2014 '+PN[g.stolenBy]+' steals</span>';
      else if(g.outcome==='tie')chip='<span class="chip ct2">Tie \u2192 fav</span>';
      else if(g.outcome==='upset')chip='<span class="chip cu">&#x1F6A8; '+g.dogTeam+' wins</span>';
      else chip='<span class="chip cpd">Pending</span>';
      var sd=g.spread!==''&&g.spread!==null?(g.spread>0?'+'+g.spread:g.spread):'&mdash;';
      h+='<tr><td style="font-size:10px;color:var(--mu)">'+g.regionCode+'</td>'
        +'<td style="font-size:10px;font-weight:600;color:var(--mu)">'+g.favSeed+'</td>'
        +'<td style="font-weight:600;font-size:11px">'+g.favTeam+'</td>'
        +'<td style="font-size:11px;color:var(--mu)">'+sd+'</td>'
        +'<td style="font-size:10px;color:var(--mu)">vs</td>'
        +'<td style="font-size:11px">'+g.dogTeam+'</td>'
        +'<td>'+chip+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  document.getElementById('mc').innerHTML=h;
}
function rRu(){
  document.getElementById('mc').innerHTML='<div class="stl">Rules</div>'
    +'<div class="rc"><h3>Scoring</h3>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Lines lock 1 hour before tip-off.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Fav covers</strong> \u2192 fav player advances.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Fav wins, no cover</strong> \u2192 dog player steals the winning team &#x2605;.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Exact tie</strong> \u2192 fav covers.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Dog wins outright</strong> \u2192 dog player advances.</span></div></div>'
    +'<div class="rc"><h3>Quick Reference</h3>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:11px;margin-top:5px">'
    +'<div style="background:var(--gnl);color:var(--gn);padding:8px;border-radius:5px;font-weight:600">Fav covers<br><span style="font-weight:400">Fav advances</span></div>'
    +'<div style="background:var(--gdl);color:#8a6200;padding:8px;border-radius:5px;font-weight:600">No cover<br><span style="font-weight:400">Dog steals &#x2605;</span></div>'
    +'<div style="background:var(--nvl);color:var(--nvm);padding:8px;border-radius:5px;font-weight:600">Exact tie<br><span style="font-weight:400">Fav covers</span></div>'
    +'<div style="background:var(--pul);color:var(--pu);padding:8px;border-radius:5px;font-weight:600">&#x1F6A8; Dog wins<br><span style="font-weight:400">Dog advances</span></div>'
    +'</div></div>'
    +'<div class="rc"><h3>Live Updates</h3>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Scores auto-refresh every <strong>60s</strong> (30s during live games) via ESPN.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Teams playing now show &#x23F1;. Final scores resolve pool outcomes automatically.</span></div></div>';
}
function sT(n){
  curTab=n;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  var m={st:0,br:1,re:2,ru:3};
  document.querySelectorAll('.tab')[m[n]].classList.add('active');
  rerender();
}
function rerender(){
  if(curTab==='st')rSt();else if(curTab==='br')rBr();else if(curTab==='re')rRe();else if(curTab==='ru')rRu();
}
// Init: render immediately with static data, then fetch live
rSt();
fetchScores();
</script>
