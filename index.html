// Build ESPN URL for a given date (YYYYMMDD)
function espnUrl(dateStr){
  return 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=100&limit=1000'+(dateStr?'&dates='+dateStr:'');
}
function todayStr(){var d=new Date();return d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0')+''+String(d.getDate()).padStart(2,'0');}
function tomorrowStr(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0')+''+String(d.getDate()).padStart(2,'0');}

// Compute the current active round based on GM data
function currentRound(){
  // Find the highest round that has any non-pending games, or any pending games
  var maxRoundWithAction=0;
  GM.forEach(function(g){
    if(g.outcome!=='pending'&&g.round>maxRoundWithAction)maxRoundWithAction=g.round;
  });
  // If there are pending games in a round higher than maxRoundWithAction, show that round
  var pendingRounds=GM.filter(function(g){return g.outcome==='pending';}).map(function(g){return g.round;});
  if(pendingRounds.length){
    var minPending=Math.min.apply(null,pendingRounds);
    return minPending;
  }
  return maxRoundWithAction;
}

function fetchScores(){
  var sp=document.getElementById('lv-spin');
  var st=document.getElementById('lv-status');
  if(sp)sp.style.display='inline-block';
  if(st)st.textContent='Fetching scores...';
  // Fetch today and tomorrow in parallel, merge results
  var today=todayStr(), tmrw=tomorrowStr();
  var results={today:null,tmrw:null};
  function tryMerge(){
    if(results.today===null||results.tmrw===null)return; // wait for both
    var merged={events:(results.today||[]).concat(results.tmrw||[])};
    processESPN(merged);
    lastSync=new Date();
    var st2=document.getElementById('lv-status');
    var sp2=document.getElementById('lv-spin');
    if(st2)st2.textContent='Updated '+lastSync.toLocaleTimeString();
    if(sp2)sp2.style.display='none';
    var ft=document.querySelector('.footer');
    if(ft)ft.textContent='2026 Westover Companies Basketball Pool \xb7 Live \xb7 '+lastSync.toLocaleTimeString();
    scheduleNext();
    rerender();
  }
  xhrFetch(today,function(evs){results.today=evs;tryMerge();});
  xhrFetch(tmrw,function(evs){results.tmrw=evs;tryMerge();});
}

function xhrFetch(dateStr,cb){
  var base=espnUrl(dateStr);
  var proxies=[
    'https://corsproxy.io/?url='+encodeURIComponent(base),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(base),
    'https://thingproxy.freeboard.io/fetch/'+base,
    base
  ];
  function tryIdx(idx){
    if(idx>=proxies.length){cb([]);return;}
    var xhr=new XMLHttpRequest();
    xhr.open('GET',proxies[idx],true);
    xhr.timeout=10000;
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;
      if(xhr.status===200&&xhr.responseText){
        try{
          var d=JSON.parse(xhr.responseText);
          if(d&&d.contents)d=JSON.parse(d.contents);
          if(d&&d.events){cb(d.events);return;}
        }catch(e){}
      }
      tryIdx(idx+1);
    };
    xhr.ontimeout=function(){tryIdx(idx+1);};
    xhr.onerror=function(){tryIdx(idx+1);};
    try{xhr.send();}catch(e){tryIdx(idx+1);}
  }
  tryIdx(0);
}

function processESPN(data){
  LIVE=[];
  window._gameTimes=window._gameTimes||{};
  var anyLive=false;
  var dbg=[];
  (data.events||[]).forEach(function(ev){
    var comp=ev.competitions&&ev.competitions[0];
    if(!comp)return;
    var state=ev.status&&ev.status.type&&ev.status.type.state;
    var comps=comp.competitors||[];
    if(comps.length<2)return;
    var c0=comps[0], c1=comps[1];
    var n0=mn(c0.team&&c0.team.displayName||'');
    var n1=mn(c1.team&&c1.team.displayName||'');
    // Try to match this event to a pool game regardless of state
    var pg=GM.find(function(g){
      return(g.favTeam===n0||g.favTeam===n1)&&(g.dogTeam===n0||g.dogTeam===n1);
    });
    // Always capture tip time for matched games, even pre-game
    if(pg&&ev.date){
      var tipKey=pg.favTeam+'|'+pg.dogTeam;
      if(state==='pre'||!window._gameTimes[tipKey]){
        var d=new Date(ev.date);
        var today=new Date();
        var isToday=d.toDateString()===today.toDateString();
        var tmrw=new Date(today); tmrw.setDate(today.getDate()+1);
        var isTmrw=d.toDateString()===tmrw.toDateString();
        var dayStr=isToday?'Today':isTmrw?'Tomorrow':d.toLocaleDateString([],{weekday:'short',month:'numeric',day:'numeric'});
        var timeStr=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
        window._gameTimes[tipKey]=dayStr+' '+timeStr;
      }
      if(state==='post') window._gameTimes[tipKey]='Final';
    }
    // Skip scoring logic for pre-game
    if(state==='pre')return;
    var s0=parseInt(c0.score)||0;
    var s1=parseInt(c1.score)||0;
    if(!pg){
      if(state==='in'||state==='post')dbg.push('NO MATCH: '+n0+' vs '+n1);
      return;
    }
    var favS=(pg.favTeam===n0)?s0:s1;
    var dogS=(pg.favTeam===n0)?s1:s0;
    dbg.push((state==='in'?'LIVE':'FINAL')+': '+pg.favTeam+' '+favS+' vs '+pg.dogTeam+' '+dogS+' (was:'+pg.outcome+')');
    if(state==='in'){
      anyLive=true;
      LIVE.push({favTeam:pg.favTeam,dogTeam:pg.dogTeam,favScore:favS,dogScore:dogS,
        clock:ev.status.displayClock||'',period:ev.status.period||1,spread:pg.spread});
    }
    if(state==='post'&&pg.outcome==='pending'){
      var margin=favS-dogS;
      if(margin>0){
        var cov=margin+pg.spread; // spread is negative, e.g. -9.5
        if(cov>0)pg.outcome='covers';
        else if(cov===0)pg.outcome='tie';
        else{pg.outcome='no-cover';pg.stolenBy=findDogOwner(pg);}
      }else{
        pg.outcome='upset';
      }
      dbg.push('  → resolved to: '+pg.outcome+(pg.stolenBy!==null?' stolen by '+PN[pg.stolenBy]:''));
    }
  });
  hasLive=anyLive;
  var badge=document.getElementById('lv-badge');
  if(badge)badge.style.display=anyLive?'inline-flex':'none';
  // Store debug log for status bar (visible via long-press or check)
  window._espnDbg=dbg;
  console.log('ESPN match log:',dbg.join(' | '));
}

function findDogOwner(g){
  for(var pi=0;pi<PN.length;pi++){
    var regAS=AS[g.region]||{};
    var found=Object.entries(regAS).find(function(e){return parseInt(e[1])===pi&&parseInt(e[0])===g.dogSeed;});
    if(found)return pi;
  }
  return null;
}

function cT(pi){
  var base=RG.map(function(r,ri){
    var e=Object.entries(AS[r]||{}).find(function(entry){return parseInt(entry[1])===pi;});
    if(e){var sn=parseInt(e[0]);var t=BK[r].find(function(t){return t.seed===sn;});return{region:r,rc:RC[ri],team:t?t.team:'TBD',seed:sn,alive:true,acq:false};}
    return{region:r,rc:RC[ri],team:'TBD',seed:'',alive:true,acq:false};
  });
  GM.forEach(function(g){
    if(g.outcome==='covers'||g.outcome==='tie')base.forEach(function(t){if(t.team===g.dogTeam)t.alive=false;});
    else if(g.outcome==='no-cover')base.forEach(function(t){if(t.team===g.favTeam||t.team===g.dogTeam)t.alive=false;});
    else if(g.outcome==='upset')base.forEach(function(t){if(t.team===g.favTeam)t.alive=false;});
  });
  var ex=[];
  GM.forEach(function(g){if(g.outcome==='no-cover'&&g.stolenBy===pi)ex.push({region:g.region,rc:g.regionCode,team:g.favTeam,seed:g.favSeed,alive:true,acq:true});});
  return base.concat(ex);
}

    rt.sort(function(a,b){return(a.seed||99)-(b.seed||99);});
    h+='<div class="rhdr">'+r+' Region</div><table class="gt"><thead><tr><th>#</th><th>Team</th><th>Owner</th><th>Status</th></tr></thead><tbody>';
    rt.filter(function(t){return t.team!=='TBD';}).forEach(function(t){
      var live=isLiveTeam(t.team);
      h+='<tr><td style="font-size:10px;font-weight:600;color:var(--mu)">'+t.seed+'</td>'
        +'<td style="font-weight:600;font-size:11px">'+t.team+(t.acq?' <span style="font-size:9px;color:var(--or)">&#x2605;</span>':'')+(live?' <span style="font-size:9px;color:#c00">&#x23F1;</span>':'')+'</td>'
        +'<td style="font-size:11px">'+t.pn+'</td>'
        +'<td>'+(live?'<span style="color:#c00;font-size:11px;font-weight:600">Playing</span>':t.alive?'<span style="color:var(--gn);font-size:11px;font-weight:600">Alive</span>':'<span style="color:var(--mu);font-size:11px">Out</span>')+'</td></tr>';
    });
    h+='</tbody></table>';
  });
  document.getElementById('mc').innerHTML=h;
}
// Helper: find who owns a team (by pool team name), returns player name or null
function getOwner(teamName){
  for(var pi=0;pi<PN.length;pi++){
    var teams=cT(pi);
    if(teams.some(function(t){return t.team===teamName&&!t.acq;}))return PN[pi];
  }
  return null;
}
// Helper: find who stole a team
function getAcqOwner(teamName){
  for(var pi=0;pi<PN.length;pi++){
    var teams=cT(pi);
    if(teams.some(function(t){return t.team===teamName&&t.acq;}))return PN[pi];
  }
  return null;
}

function rRe(){
  if(CR===-1)CR=currentRound();
  var gl=GM.filter(function(g){return g.round===CR;});
  var h='<div class="stl">Results</div>'+liveBar()+'<div class="fr"><label style="font-size:12px;font-weight:500">Round:</label><select class="rs" onchange="CR=parseInt(this.value);rRe()">';
  RNS.forEach(function(n,i){h+='<option value="'+i+'"'+(i===CR?' selected':'')+'>'+n+'</option>';});
  h+='</select></div>';
  if(!gl.length){h+='<p style="color:var(--mu);font-size:12px">No games recorded yet.</p>';}
  else{
    h+='<table class="gt"><thead><tr>'
      +'<th>Time</th>'
      +'<th>Favored</th><th>Owner</th>'
      +'<th>Sprd</th>'
      +'<th>Underdog</th><th>Owner</th>'
      +'<th>Result</th>'
      +'</tr></thead><tbody>';
    gl.forEach(function(g){
      var live=LIVE.find(function(l){return l.favTeam===g.favTeam;});
      var chip;
      if(live){
        var cov=(live.favScore-live.dogScore)+live.spread>0;
        chip='<span class="chip c-live">&#x23F1; '+live.favScore+'\u2013'+live.dogScore+'<br>'+(cov?'covering':'not cvr')+'</span>';
      }else if(g.outcome==='covers')chip='<span class="chip cc">Covered</span>';
      else if(g.outcome==='no-cover')chip='<span class="chip cn">No cover<br>'+PN[g.stolenBy]+' steals</span>';
      else if(g.outcome==='tie')chip='<span class="chip ct2">Tie \u2192 fav</span>';
      else if(g.outcome==='upset')chip='<span class="chip cu">&#x1F6A8; Upset</span>';
      else chip='<span class="chip cpd">Pending</span>';

      var sd=g.spread!==''&&g.spread!==null?(g.spread>0?'+'+g.spread:g.spread):'&mdash;';

      // Game time from ESPN feed if available, else blank
      var tipKey=g.favTeam+'|'+g.dogTeam;
      var tipTime=(window._gameTimes&&window._gameTimes[tipKey])||
                  (window._gameTimes&&window._gameTimes[g.dogTeam+'|'+g.favTeam])||'';

      // Owners — for no-cover the fav owner loses the team; show stolen indicator
      var favOwner=getOwner(g.favTeam)||getAcqOwner(g.favTeam)||'&mdash;';
      var dogOwner=getOwner(g.dogTeam)||'&mdash;';

      // Style owners based on outcome
      var favOwnerStyle='font-size:10px;color:var(--mu)';
      var dogOwnerStyle='font-size:10px;color:var(--mu)';
      if(g.outcome==='covers'||g.outcome==='tie'){
        favOwnerStyle='font-size:10px;color:var(--gn);font-weight:600';
        dogOwnerStyle='font-size:10px;color:var(--mu);text-decoration:line-through';
      }else if(g.outcome==='no-cover'){
        favOwnerStyle='font-size:10px;color:var(--mu);text-decoration:line-through';
        dogOwnerStyle='font-size:10px;color:var(--or);font-weight:600';
      }else if(g.outcome==='upset'){
        favOwnerStyle='font-size:10px;color:var(--mu);text-decoration:line-through';
        dogOwnerStyle='font-size:10px;color:var(--gn);font-weight:600';
      }

      h+='<tr>'
        +'<td style="font-size:9px;color:var(--mu);white-space:nowrap">'+g.regionCode+(tipTime?'<br>'+tipTime:'')+'</td>'
        +'<td style="font-weight:600;font-size:11px">'+g.favTeam+'</td>'
        +'<td style="'+favOwnerStyle+'">'+favOwner+'</td>'
        +'<td style="font-size:11px;color:var(--mu)">'+sd+'</td>'
        +'<td style="font-size:11px">'+g.dogTeam+'</td>'
        +'<td style="'+dogOwnerStyle+'">'+dogOwner+'</td>'
        +'<td>'+chip+'</td>'
        +'</tr>';
    });
    h+='</tbody></table>';
  }
  document.getElementById('mc').innerHTML=h;
}
function rRu(){
  document.getElementById('mc').innerHTML='<div class="stl">Rules</div>'
    +'<div class="rc"><h3>Scoring</h3>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Lines lock 1 hour before tip-off.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Fav covers</strong> \u2192 fav player advances.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Fav wins, no cover</strong> \u2192 dog player steals the winning team &#x2605;.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Exact tie</strong> \u2192 fav covers.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span><strong>Dog wins outright</strong> \u2192 dog player advances.</span></div></div>'
    +'<div class="rc"><h3>Quick Reference</h3>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:11px;margin-top:5px">'
    +'<div style="background:var(--gnl);color:var(--gn);padding:8px;border-radius:5px;font-weight:600">Fav covers<br><span style="font-weight:400">Fav advances</span></div>'
    +'<div style="background:var(--gdl);color:#8a6200;padding:8px;border-radius:5px;font-weight:600">No cover<br><span style="font-weight:400">Dog steals &#x2605;</span></div>'
    +'<div style="background:var(--nvl);color:var(--nvm);padding:8px;border-radius:5px;font-weight:600">Exact tie<br><span style="font-weight:400">Fav covers</span></div>'
    +'<div style="background:var(--pul);color:var(--pu);padding:8px;border-radius:5px;font-weight:600">&#x1F6A8; Dog wins<br><span style="font-weight:400">Dog advances</span></div>'
    +'</div></div>'
    +'<div class="rc"><h3>Live Updates</h3>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Scores auto-refresh every <strong>60s</strong> (30s during live games) via ESPN.</span></div>'
    +'<div class="ri"><span class="ric">&#x25B8;</span><span>Teams playing now show &#x23F1;. Final scores resolve pool outcomes automatically.</span></div></div>';
}
function rDb(){
  var dbg=window._espnDbg||[];
  var h='<div class="stl">ESPN Debug Log</div>';
  h+='<div style="font-size:11px;margin-bottom:10px;color:var(--mu)">Shows what ESPN returned and how each game was matched/resolved last refresh.</div>';
  h+='<div style="background:var(--b2);border-radius:8px;padding:10px;font-family:monospace;font-size:11px;line-height:1.8;">';
  if(!dbg.length){h+='No data yet — tap Refresh first.';}
  else{h+=dbg.map(function(l){
    var color=l.indexOf('NO MATCH')>=0?'#c00':l.indexOf('LIVE')>=0?'#c00':l.indexOf('resolved')>=0?'var(--gn)':'var(--tx)';
    return '<div style="color:'+color+'">'+l+'</div>';
  }).join('');}
  h+='</div>';
  h+='<div style="margin-top:12px;font-size:11px;font-weight:600;color:var(--mu)">All GM game states:</div>';
  h+='<div style="background:var(--b2);border-radius:8px;padding:10px;font-family:monospace;font-size:10px;line-height:1.8;margin-top:4px;">';
  GM.forEach(function(g){
    var color=g.outcome==='pending'?'var(--mu)':g.outcome==='upset'?'var(--pu)':g.outcome==='no-cover'?'var(--or)':'var(--gn)';
    h+='<div style="color:'+color+'">'+g.regionCode+' '+g.favTeam+' vs '+g.dogTeam+': <strong>'+g.outcome+'</strong>'+(g.stolenBy!==null?' ('+PN[g.stolenBy]+' steals)':'')+'</div>';
  });
  h+='</div>';
  document.getElementById('mc').innerHTML=h;
}
function sT(n){
  curTab=n;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  var m={st:0,br:1,re:2,ru:3,db:4};
  document.querySelectorAll('.tab')[m[n]].classList.add('active');
  rerender();
}
function rerender(){
  if(curTab==='st')rSt();else if(curTab==='br')rBr();else if(curTab==='re')rRe();else if(curTab==='ru')rRu();else if(curTab==='db')rDb();
}
// Init: render immediately with static data, then fetch live
rSt();
fetchScores();
</script>
</body>
</html>
